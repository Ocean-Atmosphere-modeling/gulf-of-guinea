# window.conf
#
# The ONE place the Gulf of Guinea run window is defined.
#
# Every driver in bash_scripts/ and python/ sources this file, and
# python/run_window.py reads it, so bash and python can never disagree.
# Plain KEY=value lines only - no quotes, no shell logic (python parses it too).
#
# Forecast (rolling) mode - the default
#   window = today - NDAYS_BACK  ...  today + NDAYS_FWD
NDAYS_BACK=3
NDAYS_FWD=1

# Hindcast (fixed) mode - uncomment BOTH lines to pin the window to fixed dates.
# When START_DATE is set it is used instead of NDAYS_BACK/NDAYS_FWD everywhere.
#START_DATE=2026-10-01
#END_DATE=2026-11-01

# ECMWF IFS open data reaches 144 h, so (NDAYS_FWD + 1) * 24 <= 144.
# Only checked when the metdl/frc steps run.
MAX_DAYS_FWD_MET=5

# ECMWF open-data model and grid spacing, used by the metdl and frc steps.
#   ECMWF_MODEL  ifs | aifs-single | aifs-ens
#   ECMWF_RESOL  0p25 (0.25 deg) | 0p1 (0.1 deg, ifs only)
# 0.1 deg gives a finer wind field but the files are about 4.6x bigger and
# only go back to 2026-10-21; 0.25 deg goes back to 2024-02-29.
ECMWF_MODEL=ifs
ECMWF_RESOL=0p1
