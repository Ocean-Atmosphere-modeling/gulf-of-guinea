# site.conf
#
# Machine-specific settings: everything that changes when the pipeline moves to
# a different system. Edit this file (and nothing else) on a new machine.
#
# Sourced by the shell drivers and read by python/site_paths.py, so bash and
# python always agree. Plain KEY=value lines only - python parses it too.
# Environment variables of the same name override what is set here.
#
# Companion file: window.conf holds WHAT to run (time window, ECMWF model and
# grid); this file holds WHERE it runs.

# Root of the data tree. The scripts expect, and create as needed:
#   $DATA_ROOT/data/{downloads,blk,glofas,imp_files,bry,clm,ini}
#   $DATA_ROOT/inp/{ini,bry,clm,riv}
#   $DATA_ROOT/out/forecast/{logs,<START_DATE>}
DATA_ROOT=/projects/f_omg_1/moa/africa

# ROMS grid. Leave commented to use $DATA_ROOT/data/imp_files/grd_GulfOfGuinea_4km.nc
#GRID_FILE=/path/to/grd_GulfOfGuinea_4km.nc

# Conda environment used by every python step
CONDA_ENV=guinea2
CONDA_SH=$HOME/miniforge3/etc/profile.d/conda.sh

# The compiled ROMS executable that run/job_gog.sh launches. The default is
# the one built in run/ by run/build_roms.sh. Point it somewhere else to use a
# build you already have, for example:
#   ROMS_EXE=/path/to/another/checkout/romsM
#ROMS_EXE=./romsM
ROMS_EXE=/projects/f_omg_1/bhorwitz/gulfofguinea/romsM

# Output folder naming. ROMS output goes to
#     $DATA_ROOT/out/forecast/<START_DATE><OUTPUT_SUFFIX>/
# The folder is named after the cycle start date, so without a suffix two people
# who run the same date write into the same folder and overwrite each other.
# `_$USER` gives everyone their own. Set it empty for a bare date.
OUTPUT_SUFFIX=_$USER

# Slurm. SLURM_PARTITION is passed on the sbatch command line by
# run_forecast_cycle.sh, which overrides the #SBATCH --partition default
# written in the job scripts. Leave SLURM_ACCOUNT empty to not pass --account.
SLURM_PARTITION=p_omg_1
SLURM_ACCOUNT=
